<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PVE Snippets — Mock Console (dev only)</title>
  <script>
    // Auto-add the query params PVE Snippets' isProxmoxConsole() looks for, so opening
    // this file directly (no query string) still activates the extension's floating panel.
    (function () {
      if (!location.search.includes('console=')) {
        location.replace(location.pathname + '?console=kvm&vmid=100&node=test' + location.hash);
      }
    })();
  </script>
  <style>
    :root {
      --bg: #141414;
      --bg-panel: #1a1a1a;
      --border: #2a2a2a;
      --text: #fff;
      --text-muted: #8a8a8a;
      --accent: #f60;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px;
    }
    h1 { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; }
    .warning {
      font-size: 11px; color: var(--accent); border: 1px solid var(--accent);
      border-radius: 4px; padding: 6px 10px; margin-bottom: 12px; max-width: 480px;
    }
    #console-col { flex: 1 1 480px; min-width: 320px; }
    canvas {
      display: block; width: 100%; max-width: 640px; aspect-ratio: 4 / 3;
      background: #000; border: 1px solid var(--border); border-radius: 4px; outline: none;
    }
    #panel-col { flex: 1 1 360px; min-width: 300px; }
    .box {
      background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px;
      padding: 12px; margin-bottom: 12px;
    }
    label { display: block; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; }
    select, button {
      font-family: inherit; font-size: 12px; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; cursor: pointer;
    }
    .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .row:last-child { margin-bottom: 0; }
    .checkbox-row { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
    #vm-screen {
      white-space: pre-wrap; word-break: break-all; min-height: 90px; max-height: 200px;
      overflow-y: auto; background: #000; border: 1px solid var(--border); border-radius: 4px;
      padding: 8px; font-size: 12px; margin-top: 8px;
    }
    #event-log {
      max-height: 180px; overflow-y: auto; font-size: 10px; color: var(--text-muted);
      border-top: 1px solid var(--border); margin-top: 8px; padding-top: 6px;
    }
    #event-log div { white-space: nowrap; }
    #clear-btn { margin-top: 8px; }
    .hint { font-size: 11px; color: var(--text-muted); line-height: 1.5; }
  </style>
</head>
<body>
  <div id="console-col">
    <h1>Mock PVE noVNC Console</h1>
    <div class="warning">Dev tool only — not a real console. See dev/README.md.</div>
    <canvas id="fake-canvas" tabindex="0" width="640" height="480"></canvas>
  </div>

  <div id="panel-col">
    <div class="box">
      <div class="row">
        <div style="flex:1">
          <label for="guest-layout">Simulated guest layout</label>
          <select id="guest-layout">
            <option value="us">US QWERTY</option>
            <option value="uk">UK QWERTY</option>
            <option value="de">German QWERTZ</option>
            <option value="fr">French AZERTY</option>
          </select>
        </div>
      </div>
      <div class="checkbox-row">
        <input type="checkbox" id="strict-mode" checked />
        <label for="strict-mode" style="margin:0;text-transform:none;letter-spacing:0;">Strict physical-key mode (ignore <code>key</code>, resolve from code+modifiers)</label>
      </div>
      <p class="hint">Set the extension's <strong>Settings → Keyboard layout</strong> to match the layout above, then paste some text. The VM screen below should reproduce it exactly.</p>
      <label for="vm-screen">VM screen (resolved output)</label>
      <div id="vm-screen"></div>
      <button type="button" id="clear-btn">Clear</button>
    </div>

    <div class="box">
      <details>
        <summary style="cursor:pointer;font-size:11px;color:var(--text-muted);">Raw event log</summary>
        <div id="event-log"></div>
      </details>
    </div>
  </div>

  <script src="../extension/keyboard-layouts.js"></script>
  <script src="mock-console.js"></script>
</body>
</html>
