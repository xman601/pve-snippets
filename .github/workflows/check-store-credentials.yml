name: Check store credentials

# Read-only: signs in to the Chrome Web Store and Firefox Add-ons APIs with the
# publishing secrets and looks up the extension, without uploading anything.
# Runs automatically when this check changes, and manually from the Actions tab
# ("Run workflow" -- available once this file is on main).
on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths:
      - .github/workflows/check-store-credentials.yml
      - scripts/check-store-credentials.mjs

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dev dependencies
        run: npm ci

      - name: Check credentials
        run: node scripts/check-store-credentials.mjs
        env:
          CHROME_EXTENSION_ID: jampbpobgkkfoeiogobjlbhldkjgcfkg
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
